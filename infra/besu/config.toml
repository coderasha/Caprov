# Hyperledger Besu private QBFT network configuration for CAPROV.
# All validator nodes must use min-gas-price=0 for zero-fee transactions.
data-path="/var/lib/besu"
genesis-file="/config/genesis.json"
rpc-http-enabled=true
rpc-http-host="0.0.0.0"
rpc-http-api=["ETH","NET","WEB3","QBFT"]
rpc-http-cors-origins=["http://localhost:3000"]
host-allowlist=["*"]
min-gas-price=0
tx-pool-enable-balance-check=false
