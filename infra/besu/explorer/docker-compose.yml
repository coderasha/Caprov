services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: blockscout
      POSTGRES_USER: blockscout
      POSTGRES_PASSWORD: caprov-local-explorer
    volumes:
      - caprov-besu-explorer-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blockscout -d blockscout"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  backend:
    image: ghcr.io/blockscout/blockscout:latest
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    extra_hosts:
      - host.docker.internal:host-gateway
    environment:
      DATABASE_URL: postgresql://blockscout:caprov-local-explorer@postgres:5432/blockscout?ssl=false
      ECTO_SSL_MODE: disable
      ECTO_USE_SSL: "false"
      ETHEREUM_JSONRPC_VARIANT: geth
      ETHEREUM_JSONRPC_TRANSPORT: http
      ETHEREUM_JSONRPC_HTTP_URL: http://host.docker.internal:8545/
      ETHEREUM_JSONRPC_TRACE_URL: http://host.docker.internal:8545/
      ETHEREUM_JSONRPC_WS_URL: ws://host.docker.internal:8546/
      ETHEREUM_JSONRPC_DISABLE_ARCHIVE_BALANCES: "true"
      INDEXER_DISABLE_PENDING_TRANSACTIONS_FETCHER: "true"
      INDEXER_DISABLE_INTERNAL_TRANSACTIONS_FETCHER: "true"
      CHAIN_ID: "1337"
      NETWORK: CAPROV Besu Local
      SUBNETWORK: Hyperledger Besu
      COIN: CAP
      COIN_NAME: CAPROV
      DISABLE_MARKET: "true"
      SECRET_KEY_BASE: caprov-local-blockscout-not-for-production-32-bytes
    command: >-
      sh -c 'bin/blockscout eval "Elixir.Explorer.ReleaseTasks.create_and_migrate()" && bin/blockscout start'
    restart: unless-stopped

  frontend:
    image: ghcr.io/blockscout/frontend:latest
    depends_on:
      - backend
    platform: linux/amd64
    environment:
      NEXT_PUBLIC_API_HOST: localhost:26000
      NEXT_PUBLIC_API_PROTOCOL: http
      NEXT_PUBLIC_API_BASE_PATH: /
      NEXT_PUBLIC_APP_HOST: localhost:26000
      NEXT_PUBLIC_APP_PROTOCOL: http
      NEXT_PUBLIC_NETWORK_NAME: CAPROV Besu Local
      NEXT_PUBLIC_NETWORK_SHORT_NAME: CAPROV Besu
      NEXT_PUBLIC_NETWORK_ID: "1337"
      NEXT_PUBLIC_NETWORK_CURRENCY_NAME: CAPROV
      NEXT_PUBLIC_NETWORK_CURRENCY_SYMBOL: CAP
      NEXT_PUBLIC_NETWORK_CURRENCY_DECIMALS: "18"
      NEXT_PUBLIC_IS_TESTNET: "true"
      NEXT_PUBLIC_API_WEBSOCKET_PROTOCOL: ws
    restart: unless-stopped

  proxy:
    image: nginx:alpine
    depends_on:
      - backend
      - frontend
    environment:
      BACK_PROXY_PASS: http://backend:4000
      FRONT_PROXY_PASS: http://frontend:3000
    ports:
      - 127.0.0.1:26000:80
    volumes:
      - ./nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
    restart: unless-stopped

volumes:
  caprov-besu-explorer-postgres:
