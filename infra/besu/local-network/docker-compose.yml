---
x-besu-def:
  &besu-def
  restart: "on-failure"
  image: hyperledger/besu:${BESU_VERSION:-latest}
  env_file:
    - ./config/besu/.env
  entrypoint:
    - /bin/bash
    - -c
    - |

      /opt/besu/bin/besu \
      --config-file=/config/config.toml \
      --p2p-host=$$(hostname -i) ;

x-paladin-def:
  &paladin-def
  image: ghcr.io/lfdt-paladin/paladin:v1.0.0
  restart: "on-failure"
  entrypoint:
    - /bin/sh
    - -c
    - |
      rm -f /app/jna/p.*.sock
      exec java \
        --add-opens java.base/jdk.internal.misc=ALL-UNNAMED \
        --add-opens java.base/sun.nio.ch=ALL-UNNAMED \
        --add-opens java.base/java.nio=ALL-UNNAMED \
        -Dio.netty.tryReflectionSetAccessible=true \
        -Djava.io.tmpdir=/app/jna \
        -Djna.library.path=/app/jna \
        -jar /app/libs/paladin.jar \
        "$@"
    - sh

x-postgres-def:
  &postgres-def
  image: postgres:17.6-alpine
  command: -c 'max_connections=50' -c 'shared_buffers=64MB' -c 'work_mem=2MB' -c 'maintenance_work_mem=16MB'
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U postgres"]
    interval: 5s
    timeout: 5s
    retries: 10

x-postgres-env:
  &postgres-env
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: my-secret


services:

  validator1:
    << : *besu-def
    ports:
      - 21001:8545/tcp
      - 30303
      - 9545
    environment:
      - OTEL_RESOURCE_ATTRIBUTES=service.name=validator1,service.version=${BESU_VERSION:-latest}
    labels:
      - "consensus=besu"
    volumes:
      - ./config/besu/:/config
      - ./config/nodes/validator1:/opt/besu/keys
      - ./logs/besu:/tmp/besu
    networks:
      besu-dev-quickstart:
        ipv4_address: 172.16.239.11

  validator2:
    << : *besu-def
    ports:
      - 21002:8545/tcp
      - 30303
      - 9545
    environment:
      - OTEL_RESOURCE_ATTRIBUTES=service.name=validator2,service.version=${BESU_VERSION:-latest}
    labels:
      - "consensus=besu"
    volumes:
      - ./config/besu/:/config
      - ./config/nodes/validator2:/opt/besu/keys
      - ./logs/besu:/tmp/besu
    depends_on:
      - validator1
    networks:
      besu-dev-quickstart:
        ipv4_address: 172.16.239.12

  validator3:
    << : *besu-def
    ports:
      - 21003:8545/tcp
      - 30303
      - 9545
    environment:
      - OTEL_RESOURCE_ATTRIBUTES=service.name=validator3,service.version=${BESU_VERSION:-latest}
    labels:
      - "consensus=besu"
    volumes:
      - ./config/besu/:/config
      - ./config/nodes/validator3:/opt/besu/keys
      - ./logs/besu:/tmp/besu
    depends_on:
      - validator1
    networks:
      besu-dev-quickstart:
        ipv4_address: 172.16.239.13

  validator4:
    << : *besu-def
    ports:
      - 21004:8545/tcp
      - 30303
      - 9545
    environment:
      - OTEL_RESOURCE_ATTRIBUTES=service.name=validator4,service.version=${BESU_VERSION:-latest}
    labels:
      - "consensus=besu"
    volumes:
      - ./config/besu/:/config
      - ./config/nodes/validator4:/opt/besu/keys
      - ./logs/besu:/tmp/besu
    depends_on:
      - validator1
    networks:
      besu-dev-quickstart:
        ipv4_address: 172.16.239.14

  rpcnode:
    << : *besu-def
    container_name: rpcnode
    environment:
      - OTEL_RESOURCE_ATTRIBUTES=service.name=rpcnode,service.version=${BESU_VERSION:-latest}
    volumes:
      - ./config/besu/:/config
      - ./config/nodes/rpcnode:/opt/besu/keys
      - ./logs/besu:/tmp/besu
    depends_on:
      - validator1
    ports:
      - 8545:8545/tcp
      - 8546:8546/tcp
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/localhost/8545'"]
      interval: 5s
      timeout: 5s
      retries: 20      
    networks:
      besu-dev-quickstart:
        ipv4_address: 172.16.239.15






  prometheus:
    image: "prom/prometheus:v3.10.0"
    volumes:
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-remote-write-receiver
    ports:
      - 9090:9090/tcp
    networks:
      besu-dev-quickstart:
        ipv4_address: 172.16.239.32

  grafana:
    image: "grafana/grafana:12.3"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_USERS_VIEWERS_CAN_EDIT=true
    volumes:
      - ./config/grafana/provisioning/:/etc/grafana/provisioning/
      - grafana:/var/lib/grafana
    ports:
      # CAPROV web uses localhost:3000; keep Besu monitoring separate.
      - 3300:3000/tcp
    networks:
      besu-dev-quickstart:
        ipv4_address: 172.16.239.33

  loki:
    image: "grafana/loki:3.5.12"
    volumes:
      - ./config/loki/loki.yml:/etc/loki/local-config.yaml:ro
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - 3100:3100/tcp
    networks:
      besu-dev-quickstart:
        ipv4_address: 172.16.239.34

  alloy:
    image: "grafana/alloy:latest"
    ports:
      - 12345:12345/tcp
    volumes:
      - ./logs/besu:/var/log/besu:ro
      - ./config/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy:/var/lib/alloy/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: 
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    networks:
      besu-dev-quickstart:
        ipv4_address: 172.16.239.35



volumes:
  public-keys:
  prometheus:
  grafana:
  alloy:
  tempo:
  member1-postgres:
  member2-postgres:
  member3-postgres:
  
networks:
  besu-dev-quickstart:
    name: besu-dev-quickstart
    driver: bridge
    ipam:
      config:
        - subnet: 172.16.239.0/24
